<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background Squircle -->
  <rect width="64" height="64" rx="16" fill="#09090b" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#brandGrad)" stroke-width="2" stroke-opacity="0.4" />

  <!-- Monogram HS / Code Brackets Glyph -->
  <!-- Left bracket < -->
  <path d="M22 20 L13 32 L22 44" stroke="url(#brandGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Right bracket > -->
  <path d="M42 20 L51 32 L42 44" stroke="url(#brandGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Tech core / slash node -->
  <path d="M35 18 L29 46" stroke="#f4f4f5" stroke-width="4" stroke-linecap="round" />
  <circle cx="32" cy="32" r="3" fill="#10b981" />
</svg>